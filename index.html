<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamengo - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CR Flamengo</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre (Títulos)</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <section>
        <h2>Fale com a Nação</h2>
        <p>Deixe sua mensagem de apoio ao time ou sugestões para a pagina.</p>
        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" required placeholder="Saudações Rubro-Negras!"></textarea>
            <button type="submit">Enviar Mensagem</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 Página de Estudos. Tema: Flamengo.</p>
    </footer>
</body>
</html>
